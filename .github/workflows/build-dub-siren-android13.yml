name: Build and test Dub Siren Android 13

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'dub-siren-build/**'
      - '.github/workflows/build-dub-siren-android13.yml'
  push:
    branches: [ build-dub-siren-android13 ]
    paths:
      - 'dub-siren-build/**'
      - '.github/workflows/build-dub-siren-android13.yml'
  workflow_dispatch:

jobs:
  build-and-android13-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          cat dub-siren-build/source.part00 \
              dub-siren-build/source.part01 \
              dub-siren-build/source.part02 \
              dub-siren-build/source.part03 \
              dub-siren-build/source.part04 | base64 --decode > /tmp/dub-siren-source.zip
          unzip -t /tmp/dub-siren-source.zip
          unzip -q /tmp/dub-siren-source.zip -d /tmp/dub-siren
          test -f /tmp/dub-siren/DubSirenDS01-v1.2.1-android13-src/app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools' 'emulator' 'system-images;android-33;google_apis;x86_64'

      - name: Compile APK with official Android Gradle plugin
        working-directory: /tmp/dub-siren/DubSirenDS01-v1.2.1-android13-src
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK structure and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/dub-siren/DubSirenDS01-v1.2.1-android13-src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          unzip -t "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/DubSirenDS01-v1.2.1-Android13.apk"

      - name: Upload compiled APK immediately
        uses: actions/upload-artifact@v4
        with:
          name: DubSirenDS01-v1.2.1-Android13-compiled
          path: DubSirenDS01-v1.2.1-Android13.apk
          if-no-files-found: error
          retention-days: 7

      - name: Enable KVM acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Exercise app on Android 13 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash "$GITHUB_WORKSPACE/dub-siren-build/android13-smoke-test.sh"

      - name: Upload Android 13 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DubSirenDS01-v1.2.1-Android13-diagnostics
          path: |
            android13-*.txt
            DubSirenDS01-Android13-smoke-test.png
          if-no-files-found: warn
          retention-days: 7

      - name: Validate Android 13 launch
        shell: bash
        run: |
          set -euo pipefail
          cat android13-result.txt
          cat android13-install.txt
          cat android13-start.txt
          grep -q '^INSTALL_RC=0$' android13-result.txt
          grep -q '^START_RC=0$' android13-result.txt
          grep -Eq '^PID=[0-9]+' android13-result.txt
          grep -q 'com.dubsiren.ds01/.MainActivity' android13-activities.txt
          if grep -q 'Process: com.dubsiren.ds01' android13-logcat.txt; then
            grep -A80 -B20 'Process: com.dubsiren.ds01' android13-logcat.txt
            exit 1
          fi
          test -s DubSirenDS01-Android13-smoke-test.png

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: DubSirenDS01-v1.2.1-Android13-tested
          path: |
            DubSirenDS01-v1.2.1-Android13.apk
            DubSirenDS01-Android13-smoke-test.png
          if-no-files-found: error
          retention-days: 7
